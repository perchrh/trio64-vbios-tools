# Build and test on GitHub Actions (README "Continuous integration").
#
# The repository is public, so the GitHub-hosted runners used here cost nothing. The workflow only
# runs on pushes to main, on pull requests and by hand, skips changes that touch documentation, data
# books, standards or the bundled zip program alone, and cancels a run when a newer commit of the same
# branch or pull request arrives.
#
# The job roms runs `make roms` first: every chip's ROM at its memory clocks (775, 765, 764X, 764P),
# handed to the test jobs as the artifact `roms` (kept 1 day), and `make dist`: the tools as the artifact
# trio64-tools-<VERSION> (kept 90 days; the download is trio64-tools-<VERSION>.zip with trio64/tools/ in it). The tests then run as parallel jobs on those images, one
# matrix row per chip and memory clock: the slowest and the fastest image of each chip (column image).
# Each row tests its image with 2 MB, then runs the tests tagged `vram` (the ones whose result depends on
# the memory size) with 4 MB and with 1 MB. On the Trio64V2 the longest
# test, s3compat_full, has rows of its own: 2 MB on the 50 MHz image, 4 MB on the 60 MHz one. Every job
# builds NASM 3.02 from its release source (cached) and the tools with `make`. The first row of each chip
# also runs the patcher tests, which build the default ROM (without MCLK) and check it against the pinned
# SHA-256, and the EGA/CGA comparison with the unpatched reference. The last job, build-and-test, passes
# when every row passed and every ROM built (the check name branch rules can require). The coverage goal
# has its own workflow, coverage.yml, which pull requests do not start.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.pdf', 'docs/**', 'datasheets/**', 'standards/**', 'infozip/**']
  pull_request:
    paths-ignore: ['**.md', '**.pdf', 'docs/**', 'datasheets/**', 'standards/**', 'infozip/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NASM_VERSION: '3.02'

jobs:
  test:
    name: ${{ matrix.chip }} ${{ matrix.part }}
    needs: roms
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # image: the ROM from the roms job this row tests (build/roms/<chip>-<level>/...)
          # runs: one or more "VRAM|tests.py arguments" separated by ";"
          - {chip: Trio64V2, part: '50 MHz: 2, 4 and 1 MB, patcher, EGA/CGA', model: '775', image: '775-*/775M50.BIN', code: '775',
             first: true, runs: '2|--skip s3compat_full;4|-t vram --skip s3compat_full;1|-t vram --skip s3compat_full'}
          - {chip: Trio64V2, part: '60 MHz: 2, 4 and 1 MB', model: '775', image: '775-*/775M60.BIN', code: '775',
             runs: '2|--skip s3compat_full;4|-t vram --skip s3compat_full;1|-t vram --skip s3compat_full'}
          - {chip: Trio64V2, part: '50 MHz: s3compat_full 2 MB', model: '775', image: '775-*/775M50.BIN', code: '775',
             runs: '2|--tests s3compat_full'}
          - {chip: Trio64V2, part: '60 MHz: s3compat_full 4 MB', model: '775', image: '775-*/775M60.BIN', code: '775',
             runs: '4|--tests s3compat_full'}
          - {chip: Trio64V+, part: '50 MHz: 2, 4 and 1 MB, patcher, EGA/CGA', model: '765', image: '765-*/765M50.BIN',
             code: '765', first: true, runs: '2|;4|-t vram;1|-t vram'}
          - {chip: Trio64V+, part: '60 MHz: 2, 4 and 1 MB', model: '765', image: '765-*/765M60.BIN', code: '765',
             runs: '2|;4|-t vram;1|-t vram'}
          - {chip: Trio64 764X, part: '55 MHz: 2, 4 and 1 MB, patcher, EGA/CGA', model: '764x', image: '764X-*/764XM55.BIN',
             code: '764', first: true, runs: '2|;4|-t vram;1|-t vram'}
          - {chip: Trio64 764X, part: '70 MHz: 2, 4 and 1 MB', model: '764x', image: '764X-*/764XM70.BIN', code: '764',
             runs: '2|;4|-t vram;1|-t vram'}
          - {chip: Trio64 764P, part: '50 MHz: 2, 4 and 1 MB', model: '764p', image: '764P-*/764PM50.BIN', code: '764',
             runs: '2|;4|-t vram;1|-t vram'}
          - {chip: Trio64 764P, part: '60 MHz: 2, 4 and 1 MB', model: '764p', image: '764P-*/764PM60.BIN', code: '764',
             runs: '2|;4|-t vram;1|-t vram'}
    steps:
      - uses: actions/checkout@v5

      - name: Cache NASM
        id: nasm-cache
        uses: actions/cache@v4
        with:
          path: ~/nasm
          key: nasm-${{ env.NASM_VERSION }}-${{ runner.os }}

      - name: Build NASM ${{ env.NASM_VERSION }}
        if: steps.nasm-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nasm.tar.xz" \
            "https://www.nasm.us/pub/nasm/releasebuilds/$NASM_VERSION/nasm-$NASM_VERSION.tar.xz"
          tar -xf "$RUNNER_TEMP/nasm.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/nasm-$NASM_VERSION"
          ./configure --quiet
          make -j"$(nproc)" nasm
          mkdir -p ~/nasm
          cp nasm ~/nasm/

      - name: Check NASM
        run: |
          ~/nasm/nasm -v
          ~/nasm/nasm -v | grep -q "version $NASM_VERSION"

      - name: Build the tools
        run: make NASM=$HOME/nasm/nasm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the emulator test dependencies
        run: pip install '.[coverage]'

      - name: The ROMs built by make roms
        uses: actions/download-artifact@v4
        with:
          name: roms
          path: build/roms

      - name: ${{ matrix.chip }} ROM ${{ matrix.image }}
        id: rom
        run: |
          set -- build/roms/${{ matrix.image }}
          test -f "$1"
          echo "$1"
          cp "$1" "$RUNNER_TEMP/ROM.BIN"

      - name: ${{ matrix.chip }} ROM patcher tests
        if: ${{ !cancelled() && steps.rom.outcome == 'success' && matrix.first }}
        run: make ${{ matrix.code }}-rom-test NASM=$HOME/nasm/nasm

      - name: ${{ matrix.chip }} emulator tests, ${{ matrix.part }}
        if: ${{ !cancelled() && steps.rom.outcome == 'success' }}
        env:
          RUNS: ${{ matrix.runs }}
        run: |
          fail=0
          IFS=';' read -ra list <<< "$RUNS"
          for r in "${list[@]}"; do
            vram="${r%%|*}"; args="${r#*|}"
            echo "::group::${{ matrix.chip }} emulator tests with $vram MB ($args)"
            make emu-test NASM=$HOME/nasm/nasm ROM="$RUNNER_TEMP/ROM.BIN" CHIP=${{ matrix.model }} \
              VRAM="$vram" EMUARGS="$args" LOGS="emu/ci-${{ matrix.model }}-${vram}" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: ${{ matrix.chip }} EGA/CGA against the unpatched reference
        if: ${{ !cancelled() && steps.rom.outcome == 'success' && matrix.first }}
        run: |
          make ${{ matrix.code }}-ref-compare ROM="$RUNNER_TEMP/ROM.BIN"

      - name: Name for the log artifact
        id: art
        if: always()
        run: echo "name=emu-logs-$(echo '${{ matrix.chip }} ${{ matrix.part }}' | tr -c 'A-Za-z0-9+\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload the emulator logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: |
            emu/ci-*/
            !emu/**/*.BIN
          retention-days: 7
          if-no-files-found: ignore

  roms:
    name: All ROMs (make roms) and the release zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache NASM
        id: nasm-cache
        uses: actions/cache@v4
        with:
          path: ~/nasm
          key: nasm-${{ env.NASM_VERSION }}-${{ runner.os }}

      - name: Build NASM ${{ env.NASM_VERSION }}
        if: steps.nasm-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nasm.tar.xz" \
            "https://www.nasm.us/pub/nasm/releasebuilds/$NASM_VERSION/nasm-$NASM_VERSION.tar.xz"
          tar -xf "$RUNNER_TEMP/nasm.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/nasm-$NASM_VERSION"
          ./configure --quiet
          make -j"$(nproc)" nasm
          mkdir -p ~/nasm
          cp nasm ~/nasm/

      - name: Every chip's ROM at its memory clocks
        run: make roms NASM=$HOME/nasm/nasm

      - name: Upload the ROMs for the test jobs
        uses: actions/upload-artifact@v4
        with:
          name: roms
          path: build/roms/
          retention-days: 1

      - name: The release zip (make dist, the tools)
        id: dist
        run: |
          make dist NASM=$HOME/nasm/nasm
          echo "version=$(make -s version)" >> "$GITHUB_OUTPUT"

      - name: Upload the release zip
        uses: actions/upload-artifact@v4
        with:
          name: trio64-tools-${{ steps.dist.outputs.version }}
          path: build/dist/
          retention-days: 90

  build-and-test:
    name: build-and-test
    if: always()
    needs: [test, roms]
    runs-on: ubuntu-latest
    steps:
      - name: Every chip and memory size passed, every ROM built
        run: |
          echo "matrix result: ${{ needs.test.result }}, roms: ${{ needs.roms.result }}"
          test "${{ needs.test.result }}" = success
          test "${{ needs.roms.result }}" = success
