# Build and test on GitHub Actions (README "Continuous integration").
#
# The repository is public, so the GitHub-hosted runners used here cost nothing. The workflow only
# runs on pushes to main, on pull requests and by hand, skips changes that touch documentation, data
# books, standards or the bundled zip program alone, and cancels a run when a newer commit of the same
# branch or pull request arrives.
#
# Emulator tests (jobs test and stock) run when src/roms/**, src/tools/** or emu/** changed, or on
# workflow_dispatch (the tests build the tools and exercise them in the emulator). The
# job roms (make roms + make dist) still runs on every CI start. Sources live under src/tools/ and
# src/roms/; `make` builds both, CI tool steps use `make tools`.
#
# No workflow uploads patched ROM images (#145): they carry S3's and Phoenix's code. Each test job builds
# the one image it tests from the reference BIOS in reference/ (column target, at the memory clock of
# column mclk) and keeps it in the runner's temporary folder only. The job roms runs `make roms` to show
# that every chip's ROM builds at every memory clock (775, 765, 764X, 764P), without keeping them, and
# `make dist`: the tools as the artifact trio64-tools-<VERSION> (kept 90 days; the download is
# trio64-tools-<VERSION>.zip with trio64/tools/ in it, no ROM). The tests run as parallel jobs, one
# matrix row per chip and memory clock: the slowest and the fastest clock of each chip.
# Each row tests its image with 2 MB, then runs the tests tagged `vram` (the ones whose result depends on
# the memory size) with 4 MB and with 1 MB; the Trio64 rows (764X, 764P) with 1 MB only, as no Trio64
# card was built with 4 MB (the emulator still takes --vram 4 on the Trio64 model, for a run by hand). On the Trio64V2 the longest
# test, s3compat_full, has rows of its own: 2 MB on the 50 MHz image, 4 MB on the 60 MHz one. Every job
# builds NASM 3.02 from its release source (cached) and the tools with `make tools`. The first row of each
# chip also runs the patcher tests, which build the default ROM (without MCLK) and check it against the
# pinned SHA-256, and the EGA/CGA comparison with the unpatched reference. The last job, build-and-test,
# passes when every required row passed and every ROM built (the check name branch rules can require).
# The job stock runs the tools and tests on the three stock reference ROMs for their logs (artifact
# stock-logs-<chip>, logs only); its failures are expected and it is not part of build-and-test. The
# coverage goal has its own workflow, coverage.yml, which pull requests do not start.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.pdf', 'docs/**', 'datasheets/**', 'standards/**']
  pull_request:
    paths-ignore: ['**.md', '**.pdf', 'docs/**', 'datasheets/**', 'standards/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NASM_VERSION: '3.02'

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      roms: ${{ steps.filter.outputs.roms }}
      tools: ${{ steps.filter.outputs.tools }}
      emu: ${{ steps.filter.outputs.emu }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            roms:
              - 'src/roms/**'
            tools:
              - 'src/tools/**'
            emu:
              - 'emu/**'

  test:
    name: ${{ matrix.chip }} ${{ matrix.part }}
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.roms == 'true' || needs.changes.outputs.tools == 'true' || needs.changes.outputs.emu == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # target and mclk: the ROM this row builds and tests (make <target> MCLK=<mclk>)
          # runs: one or more "VRAM|tests.py arguments" separated by ";"
          - {chip: Trio64V2, part: '50 MHz: 2, 4 and 1 MB, patcher, EGA/CGA', model: '775', target: '775-rom', mclk: '50', code: '775',
             first: true, runs: '2|--skip s3compat_full;4|-t vram --skip s3compat_full;1|-t vram --skip s3compat_full'}
          - {chip: Trio64V2, part: '60 MHz: 2, 4 and 1 MB', model: '775', target: '775-rom', mclk: '60', code: '775',
             runs: '2|--skip s3compat_full;4|-t vram --skip s3compat_full;1|-t vram --skip s3compat_full'}
          - {chip: Trio64V2, part: '50 MHz: s3compat_full 2 MB', model: '775', target: '775-rom', mclk: '50', code: '775',
             runs: '2|--tests s3compat_full'}
          - {chip: Trio64V2, part: '60 MHz: s3compat_full 4 MB', model: '775', target: '775-rom', mclk: '60', code: '775',
             runs: '4|--tests s3compat_full'}
          - {chip: Trio64V+, part: '50 MHz: 2, 4 and 1 MB, patcher, EGA/CGA', model: '765', target: '765-rom', mclk: '50',
             code: '765', first: true, runs: '2|;4|-t vram;1|-t vram'}
          - {chip: Trio64V+, part: '60 MHz: 2, 4 and 1 MB', model: '765', target: '765-rom', mclk: '60', code: '765',
             runs: '2|;4|-t vram;1|-t vram'}
          - {chip: Trio64 764X, part: '55 MHz: 2 and 1 MB, patcher, EGA/CGA', model: '764x', target: '764x-rom', mclk: '55',
             code: '764', first: true, runs: '2|;1|-t vram'}
          - {chip: Trio64 764X, part: '70 MHz: 2 and 1 MB', model: '764x', target: '764x-rom', mclk: '70', code: '764',
             runs: '2|;1|-t vram'}
          - {chip: Trio64 764P, part: '50 MHz: 2 and 1 MB', model: '764p', target: '764p-rom', mclk: '50', code: '764',
             runs: '2|;1|-t vram'}
          - {chip: Trio64 764P, part: '60 MHz: 2 and 1 MB', model: '764p', target: '764p-rom', mclk: '60', code: '764',
             runs: '2|;1|-t vram'}
    steps:
      - uses: actions/checkout@v5

      - name: Cache NASM
        id: nasm-cache
        uses: actions/cache@v4
        with:
          path: ~/nasm
          key: nasm-${{ env.NASM_VERSION }}-${{ runner.os }}

      - name: Build NASM ${{ env.NASM_VERSION }}
        if: steps.nasm-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nasm.tar.xz" \
            "https://www.nasm.us/pub/nasm/releasebuilds/$NASM_VERSION/nasm-$NASM_VERSION.tar.xz"
          tar -xf "$RUNNER_TEMP/nasm.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/nasm-$NASM_VERSION"
          ./configure --quiet
          make -j"$(nproc)" nasm
          mkdir -p ~/nasm
          cp nasm ~/nasm/

      - name: Check NASM
        run: |
          ~/nasm/nasm -v
          ~/nasm/nasm -v | grep -q "version $NASM_VERSION"

      - name: Build the tools
        run: make tools NASM=$HOME/nasm/nasm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the emulator test dependencies
        run: pip install '.[coverage]'

      - name: ${{ matrix.chip }} ROM at ${{ matrix.mclk }} MHz (make ${{ matrix.target }}, not uploaded)
        id: rom
        run: make ${{ matrix.target }} NASM=$HOME/nasm/nasm MCLK=${{ matrix.mclk }} OUT="$RUNNER_TEMP/ROM.BIN"

      - name: ${{ matrix.chip }} ROM patcher tests
        if: ${{ !cancelled() && steps.rom.outcome == 'success' && matrix.first }}
        run: make ${{ matrix.code }}-rom-test NASM=$HOME/nasm/nasm

      - name: ${{ matrix.chip }} emulator tests, ${{ matrix.part }}
        if: ${{ !cancelled() && steps.rom.outcome == 'success' }}
        env:
          RUNS: ${{ matrix.runs }}
        run: |
          fail=0
          IFS=';' read -ra list <<< "$RUNS"
          for r in "${list[@]}"; do
            vram="${r%%|*}"; args="${r#*|}"
            echo "::group::${{ matrix.chip }} emulator tests with $vram MB ($args)"
            make emu-test NASM=$HOME/nasm/nasm ROM="$RUNNER_TEMP/ROM.BIN" CHIP=${{ matrix.model }} \
              VRAM="$vram" EMUARGS="$args" LOGS="emu/ci-${{ matrix.model }}-${vram}" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: ${{ matrix.chip }} EGA/CGA against the unpatched reference
        if: ${{ !cancelled() && steps.rom.outcome == 'success' && matrix.first }}
        run: |
          make ${{ matrix.code }}-ref-compare ROM="$RUNNER_TEMP/ROM.BIN"

      - name: Name for the log artifact
        id: art
        if: always()
        run: echo "name=emu-logs-$(echo '${{ matrix.chip }} ${{ matrix.part }}' | tr -c 'A-Za-z0-9+\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload the emulator logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: |
            emu/ci-*/
            !emu/**/*.BIN
          retention-days: 7
          if-no-files-found: ignore

  roms:
    name: All ROMs (make roms) and the release zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: similarity.py self-test (first, it takes a second)
        run: python3 emu/similarity.py --self-test

      - name: Cache NASM
        id: nasm-cache
        uses: actions/cache@v4
        with:
          path: ~/nasm
          key: nasm-${{ env.NASM_VERSION }}-${{ runner.os }}

      - name: Build NASM ${{ env.NASM_VERSION }}
        if: steps.nasm-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nasm.tar.xz" \
            "https://www.nasm.us/pub/nasm/releasebuilds/$NASM_VERSION/nasm-$NASM_VERSION.tar.xz"
          tar -xf "$RUNNER_TEMP/nasm.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/nasm-$NASM_VERSION"
          ./configure --quiet
          make -j"$(nproc)" nasm
          mkdir -p ~/nasm
          cp nasm ~/nasm/

      - name: Every chip's ROM at its memory clocks (built, not uploaded)
        run: make roms NASM=$HOME/nasm/nasm

      - name: The release zip (make dist, the tools)
        id: dist
        run: |
          make dist NASM=$HOME/nasm/nasm
          echo "version=$(make -s version)" >> "$GITHUB_OUTPUT"

      - name: Upload the release zip
        uses: actions/upload-artifact@v4
        with:
          name: trio64-tools-${{ steps.dist.outputs.version }}
          path: build/dist/
          retention-days: 90

  stock:
    # The tools and every emulator test, those tagged patch too (make stock-test, tests.py --stock), on
    # the three stock reference ROMs. Failures are expected and do not fail the run (not in
    # build-and-test); the logs (S3TEST, S3COMPAT, VSHOW, VGALOG, S3REGS) are kept as an artifact.
    # Same path gate as job test: only when src/roms/** changed (or workflow_dispatch).
    name: Stock ROM ${{ matrix.chip }} (informational)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.roms == 'true' || needs.changes.outputs.tools == 'true' || needs.changes.outputs.emu == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        chip: ['775', '765', '764x']
    steps:
      - uses: actions/checkout@v5

      - name: Cache NASM
        id: nasm-cache
        uses: actions/cache@v4
        with:
          path: ~/nasm
          key: nasm-${{ env.NASM_VERSION }}-${{ runner.os }}

      - name: Build NASM ${{ env.NASM_VERSION }}
        if: steps.nasm-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nasm.tar.xz" \
            "https://www.nasm.us/pub/nasm/releasebuilds/$NASM_VERSION/nasm-$NASM_VERSION.tar.xz"
          tar -xf "$RUNNER_TEMP/nasm.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/nasm-$NASM_VERSION"
          ./configure --quiet
          make -j"$(nproc)" nasm
          mkdir -p ~/nasm
          cp nasm ~/nasm/

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the emulator test dependencies
        run: pip install '.[coverage]'

      - name: Tools and tests on the stock ${{ matrix.chip }} ROM
        run: make stock-test NASM=$HOME/nasm/nasm STOCK_CHIPS=${{ matrix.chip }} | tee emu/stock-${{ matrix.chip }}.txt

      - name: Upload the stock ROM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-logs-${{ matrix.chip }}
          path: |
            emu/stock-${{ matrix.chip }}/
            emu/stock-${{ matrix.chip }}.txt
            !emu/**/*.BIN
          retention-days: 14
          if-no-files-found: ignore

  build-and-test:
    name: build-and-test
    if: always()
    needs: [changes, test, roms]
    runs-on: ubuntu-latest
    steps:
      - name: Every chip and memory size passed, every ROM built
        run: |
          echo "changed: roms=${{ needs.changes.outputs.roms }} tools=${{ needs.changes.outputs.tools }} emu=${{ needs.changes.outputs.emu }}, matrix: ${{ needs.test.result }}, roms: ${{ needs.roms.result }}"
          test "${{ needs.roms.result }}" = success
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ needs.changes.outputs.roms }}" = "true" ] || [ "${{ needs.changes.outputs.tools }}" = "true" ] || [ "${{ needs.changes.outputs.emu }}" = "true" ]; then
            test "${{ needs.test.result }}" = success
          else
            test "${{ needs.test.result }}" = skipped
          fi
