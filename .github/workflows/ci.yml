# Build and test on GitHub Actions (README "Continuous integration").
#
# The repository is public, so the GitHub-hosted runners used here cost nothing. The workflow only
# runs on pushes to main, on pull requests and by hand, skips changes that touch documentation, data
# books, standards or the bundled zip program alone, and cancels a run when a newer commit of the same
# branch or pull request arrives.
#
# The tests run as parallel jobs, one row of the matrix per chip and memory size (the emulator tests
# took 37 minutes one after the other). Every job builds NASM 3.02 from its release source (cached),
# the tools with `make`, and its chip's ROM from the reference image in reference/ (make 775-rom, 765-rom or
# 764x-rom), checked against the pinned SHA-256. The first job of each chip also runs the patcher tests and
# the EGA/CGA comparison with the unpatched reference; the others run the emulator tests with 4 MB
# (Trio64V2) or 4 and 1 MB (Trio64V+, Trio64) of video memory, the tests tagged `vram`. On the
# Trio64V2 the longest test, s3compat_full, has a job of its own for each memory size. The last job,
# build-and-test, passes when every row passed (the check name branch rules can require). The
# patched ROM images are not kept. The coverage goal has its own workflow, coverage.yml, which pull
# requests do not start.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.pdf', 'docs/**', 'datasheets/**', 'standards/**', 'infozip/**']
  pull_request:
    paths-ignore: ['**.md', '**.pdf', 'docs/**', 'datasheets/**', 'standards/**', 'infozip/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NASM_VERSION: '3.02'

jobs:
  test:
    name: ${{ matrix.chip }} ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # runs: one or more "VRAM|tests.py arguments" separated by ";"
          - {chip: Trio64V2, part: '2 MB, patcher, EGA/CGA', model: v2, rom: 775-rom, code: '775', first: true,
             runs: '2|--skip s3compat_full'}
          - {chip: Trio64V2, part: '2 MB s3compat_full', model: v2, rom: 775-rom, code: '775',
             runs: '2|--tests s3compat_full'}
          - {chip: Trio64V2, part: '4 MB', model: v2, rom: 775-rom, code: '775',
             runs: '4|-t vram --skip s3compat_full'}
          - {chip: Trio64V2, part: '4 MB s3compat_full', model: v2, rom: 775-rom, code: '775',
             runs: '4|--tests s3compat_full'}
          - {chip: Trio64V+, part: '2 MB, patcher, EGA/CGA', model: vplus, rom: 765-rom, code: '765', first: true,
             runs: '2|'}
          - {chip: Trio64V+, part: '4 and 1 MB', model: vplus, rom: 765-rom, code: '765',
             runs: '4|-t vram;1|-t vram'}
          - {chip: Trio64, part: '2 MB, patcher, EGA/CGA', model: trio64, rom: 764x-rom, code: '764', first: true,
             runs: '2|'}
          - {chip: Trio64, part: '4 and 1 MB', model: trio64, rom: 764x-rom, code: '764',
             runs: '4|-t vram;1|-t vram'}
    steps:
      - uses: actions/checkout@v5

      - name: Cache NASM
        id: nasm-cache
        uses: actions/cache@v4
        with:
          path: ~/nasm
          key: nasm-${{ env.NASM_VERSION }}-${{ runner.os }}

      - name: Build NASM ${{ env.NASM_VERSION }}
        if: steps.nasm-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nasm.tar.xz" \
            "https://www.nasm.us/pub/nasm/releasebuilds/$NASM_VERSION/nasm-$NASM_VERSION.tar.xz"
          tar -xf "$RUNNER_TEMP/nasm.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/nasm-$NASM_VERSION"
          ./configure --quiet
          make -j"$(nproc)" nasm
          mkdir -p ~/nasm
          cp nasm ~/nasm/

      - name: Check NASM
        run: |
          ~/nasm/nasm -v
          ~/nasm/nasm -v | grep -q "version $NASM_VERSION"

      - name: Build the tools
        run: make NASM=$HOME/nasm/nasm

      - name: Upload the tools
        if: ${{ matrix.chip == 'Trio64V2' && matrix.first }}
        uses: actions/upload-artifact@v4
        with:
          name: tools
          path: build/
          retention-days: 14

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the emulator test dependencies
        run: pip install '.[coverage]'

      - name: ${{ matrix.chip }} ROM from its reference BIOS
        id: rom
        run: make ${{ matrix.rom }} NASM=$HOME/nasm/nasm OUT="$RUNNER_TEMP/ROM.BIN"

      - name: ${{ matrix.chip }} ROM patcher tests
        if: ${{ !cancelled() && steps.rom.outcome == 'success' && matrix.first }}
        run: make ${{ matrix.code }}-rom-test NASM=$HOME/nasm/nasm ROM="$RUNNER_TEMP/ROM.BIN"

      - name: ${{ matrix.chip }} emulator tests, ${{ matrix.part }}
        if: ${{ !cancelled() && steps.rom.outcome == 'success' }}
        env:
          RUNS: ${{ matrix.runs }}
        run: |
          fail=0
          IFS=';' read -ra list <<< "$RUNS"
          for r in "${list[@]}"; do
            vram="${r%%|*}"; args="${r#*|}"
            echo "::group::${{ matrix.chip }} emulator tests with $vram MB ($args)"
            make emu-test NASM=$HOME/nasm/nasm ROM="$RUNNER_TEMP/ROM.BIN" CHIP=${{ matrix.model }} \
              VRAM="$vram" EMUARGS="$args" LOGS="emu/ci-${{ matrix.model }}-${vram}" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: ${{ matrix.chip }} EGA/CGA against the unpatched reference
        if: ${{ !cancelled() && steps.rom.outcome == 'success' && matrix.first }}
        run: |
          make ${{ matrix.code }}-ref-compare ROM="$RUNNER_TEMP/ROM.BIN"

      - name: Name for the log artifact
        id: art
        if: always()
        run: echo "name=emu-logs-$(echo '${{ matrix.chip }} ${{ matrix.part }}' | tr -c 'A-Za-z0-9+\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload the emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: |
            emu/ci-*/
            !emu/**/*.BIN
          retention-days: 14
          if-no-files-found: ignore

  build-and-test:
    name: build-and-test
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Every chip and memory size passed
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = success
