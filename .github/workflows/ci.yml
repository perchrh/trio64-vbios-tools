# Build and test on GitHub Actions (README "Continuous integration").
#
# The repository is public, so the GitHub-hosted runners used here cost nothing. The workflow only
# runs on pushes to main, on pull requests and by hand, skips changes that touch documentation alone,
# and cancels a run when a newer commit of the same branch or pull request arrives.
#
# Every run: NASM 3.02 is built from its release source (cached), `make` builds every tool, the ROM is
# built from the S3 reference BIOS 2.04.07 in reference/v2/2_04_07.bin (the Makefile default of IN and
# REF) and checked against the pinned SHA-256 (make rom, make rom-test), then the emulator tests (2 and
# 4 MB) and the EGA/CGA comparison with the reference run on that ROM; each of these runs once the ROM
# is built, even when an earlier one failed. The Trio64V+ ROM (rompatch/vplus) is built the same way from
# the S3 Trio64V+ BIOS 1.03-08 in reference/vplus/1_03_08.bin and goes through its patcher tests, the
# emulator tests on the Trio64V+ model and the EGA/CGA comparison with 1.03-08, and the Trio64 ROM
# (rompatch/trio64) from the Phoenix 1.5-07 in reference/trio64/1_5_07.bin the same way on the Trio64 model.
# The patched ROM images are not kept. The coverage goal has
# its own workflow, coverage.yml, which pull requests do not start.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'datasheets/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'datasheets/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NASM_VERSION: '3.02'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Cache NASM
        id: nasm-cache
        uses: actions/cache@v4
        with:
          path: ~/nasm
          key: nasm-${{ env.NASM_VERSION }}-${{ runner.os }}

      - name: Build NASM ${{ env.NASM_VERSION }}
        if: steps.nasm-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nasm.tar.xz" \
            "https://www.nasm.us/pub/nasm/releasebuilds/$NASM_VERSION/nasm-$NASM_VERSION.tar.xz"
          tar -xf "$RUNNER_TEMP/nasm.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/nasm-$NASM_VERSION"
          ./configure --quiet
          make -j"$(nproc)" nasm
          mkdir -p ~/nasm
          cp nasm ~/nasm/

      - name: Check NASM
        run: |
          ~/nasm/nasm -v
          ~/nasm/nasm -v | grep -q "version $NASM_VERSION"

      - name: Build the tools
        run: make NASM=$HOME/nasm/nasm

      - name: Upload the tools
        uses: actions/upload-artifact@v4
        with:
          name: tools
          path: build/
          retention-days: 14

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the emulator test dependencies
        run: pip install '.[coverage]'

      - name: Build the ROM from the reference BIOS
        id: rom
        run: make rom NASM=$HOME/nasm/nasm OUT="$RUNNER_TEMP/ROM.BIN"

      - name: ROM patcher tests
        if: ${{ !cancelled() && steps.rom.outcome == 'success' }}
        run: make rom-test NASM=$HOME/nasm/nasm ROM="$RUNNER_TEMP/ROM.BIN"

      - name: Emulator tests
        if: ${{ !cancelled() && steps.rom.outcome == 'success' }}
        run: make emu-test NASM=$HOME/nasm/nasm ROM="$RUNNER_TEMP/ROM.BIN"

      - name: EGA/CGA against the reference BIOS
        if: ${{ !cancelled() && steps.rom.outcome == 'success' }}
        run: make ref-compare ROM="$RUNNER_TEMP/ROM.BIN"

      - name: Build the Trio64V+ ROM from 1.03-08
        id: vrom
        if: ${{ !cancelled() }}
        run: make vrom NASM=$HOME/nasm/nasm OUT="$RUNNER_TEMP/VROM.BIN"

      - name: Trio64V+ ROM patcher tests
        if: ${{ !cancelled() && steps.vrom.outcome == 'success' }}
        run: make vrom-test NASM=$HOME/nasm/nasm ROM="$RUNNER_TEMP/VROM.BIN"

      - name: Trio64V+ emulator tests
        if: ${{ !cancelled() && steps.vrom.outcome == 'success' }}
        run: make emu-test NASM=$HOME/nasm/nasm ROM="$RUNNER_TEMP/VROM.BIN" CHIP=vplus LOGS=emu/vlogs

      - name: Trio64V+ EGA/CGA against 1.03-08
        if: ${{ !cancelled() && steps.vrom.outcome == 'success' }}
        run: make vref-compare ROM="$RUNNER_TEMP/VROM.BIN"

      - name: Build the Trio64 ROM from Phoenix 1.5-07
        id: trom
        if: ${{ !cancelled() }}
        run: make trom NASM=$HOME/nasm/nasm OUT="$RUNNER_TEMP/TROM.BIN"

      - name: Trio64 ROM patcher tests
        if: ${{ !cancelled() && steps.trom.outcome == 'success' }}
        run: make trom-test NASM=$HOME/nasm/nasm ROM="$RUNNER_TEMP/TROM.BIN"

      - name: Trio64 emulator tests
        if: ${{ !cancelled() && steps.trom.outcome == 'success' }}
        run: make emu-test NASM=$HOME/nasm/nasm ROM="$RUNNER_TEMP/TROM.BIN" CHIP=trio64 LOGS=emu/tlogs

      - name: Trio64 EGA/CGA against 1.5-07
        if: ${{ !cancelled() && steps.trom.outcome == 'success' }}
        run: make tref-compare ROM="$RUNNER_TEMP/TROM.BIN"

      - name: Upload the emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emu-logs
          path: |
            emu/logs/
            emu/logs4/
            emu/vlogs/
            emu/vlogs4/
            emu/vlogs1/
            emu/tlogs/
            emu/tlogs4/
            emu/tlogs1/
            !emu/**/*.BIN
          retention-days: 14
          if-no-files-found: ignore
