# Python dependencies of the emulator tests in emu/ (the DOS tools themselves only need NASM).
#
# Recorded toolchain (CI and local qualification): Python 3.12, unicorn 2.1.4, capstone 5.0.9.
#
#   python3 -m venv .venv
#   .venv/bin/pip install .
#   make emu-test ROM=path/to/S3V2P15.BIN      (uses .venv/bin/python3 when it exists)
#
#   .venv/bin/pip install .[coverage]         (also capstone, for make coverage)
#
# This only installs the dependencies; emu/tests.py, emu/codemap.py, emu/refcompare.py and emu/cover.py
# run from the source tree.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trio64-vbios-tools-emu"
version = "1.0.0"
description = "Emulator tests for the Trio64V2/DX VBIOS DOS tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "unicorn==2.1.4",    # x86 CPU emulator
]

[project.optional-dependencies]
coverage = [
    "capstone==5.0.9",   # x86 disassembler for emu/codemap.py (make coverage)
]

[tool.setuptools]
py-modules = []
packages = []
